# Declare your Buildkite pipelines below
---
# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: buildkite-pipeline-version-bump-dra-buildkite-plugin
  description: Buildkite Pipeline for version-bump-dra-buildkite-plugin
  links:
    - title: Pipeline
      url: https://buildkite.com/elastic/version-bump-dra-buildkite-plugin

spec:
  type: buildkite-pipeline
  owner: group:artifact-management
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: version-bump-dra-buildkite-plugin
      description: Buildkite plugin that waits for DRA to reach the expected version during version bump
    spec:
      repository: elastic/version-bump-dra-buildkite-plugin
      pipeline_file: ".buildkite/pipeline.yml"
      provider_settings:
        build_pull_request_forks: true
      teams:
        artifact-management:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: READ_ONLY
