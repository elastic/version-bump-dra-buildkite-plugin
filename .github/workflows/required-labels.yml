name: required-labels

on:
  merge_group:
  pull_request:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
      - synchronize

permissions:
  contents: read

jobs:
  check-labels:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: labels
        name: Get changelog labels
        run: |
          labels="$(sed -n 's/^- name: "\(changelog:[^"]*\)"/\1/p' .github/labels.yml | paste -sd, -)"
          if [[ -z "${labels}" ]]; then
            echo "::error::No changelog labels found in .github/labels.yml"
            exit 1
          fi
          echo "labels=${labels}" >> "${GITHUB_OUTPUT}"
      - uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          mode: exactly
          count: 1
          use_regex: false
          add_comment: false
          labels: ${{ steps.labels.outputs.labels }}
